<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shot coach</title>
<style>
  :root {
    --ink: #1c1b19; --paper: #f6f5f2; --card: #ffffff; --line: #d9d6cf;
    --key: #8a4f05; --fill: #3d4f9a; --window: #1f5a94;
    --green: #3ccf6e; --amber: #ffb347; --red: #ff5a52;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 18px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; background: var(--paper); color: var(--ink); }
  [hidden] { display: none !important; }

  /* Plan screen */
  #plan { max-width: 980px; margin: 0 auto; padding: 20px; }
  #plan h1 { font-size: 26px; margin: 0 0 4px; }
  #plan .lead { margin: 0 0 16px; }
  .plan-grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .plan-grid svg { background: #ecebe6; border-radius: 10px; max-width: 100%; height: auto; }
  .side { flex: 1 1 280px; min-width: 260px; }
  .label { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #4a4843; margin-top: 14px; }
  .side p { margin: 4px 0; }

  /* Coach screen, layout B: big type on dark */
  #coach { min-height: 100vh; background: #111; color: #fff; padding: 24px 20px 28px; display: flex; flex-direction: column; text-align: center; position: relative; }
  #instruction { font-size: clamp(48px, 9vw, 96px); font-weight: 700; line-height: 1.08; margin: 12px 0 0; }
  #detail { font-size: clamp(32px, 5vw, 48px); line-height: 1.25; color: #ffb347; margin: 18px 0 0; }
  #lights { display: flex; justify-content: center; gap: clamp(24px, 8vw, 80px); margin: auto 0; padding: 32px 0; }
  .light { min-width: 90px; }
  .lamp { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 10px; background: #555; }
  .lamp.green { background: var(--green); } .lamp.amber { background: var(--amber); } .lamp.red { background: var(--red); }
  .light span { font-size: 24px; color: #d0d0d0; }
  #banner { font-size: 20px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #ff8a84; margin: 0; }
  #coach.take #lights { gap: clamp(16px, 5vw, 56px); }
  #coach.take .lamp { width: 104px; height: 104px; }
  #coach.take .light span { font-size: 32px; color: #fff; }
  #report-text { font-size: clamp(36px, 7vw, 64px); font-weight: 700; line-height: 1.2; margin: auto 0; }
  #ended h1 { font-size: clamp(44px, 9vw, 80px); line-height: 1.1; margin: 0 0 24px; }
  #ended p { font-size: clamp(30px, 5vw, 44px); line-height: 1.25; margin: 0; color: #ffb347; }
  #ended, #report { min-height: 100vh; background: #111; color: #fff; padding: 24px 20px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  #thumb { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: #333; margin: 0 0 14px; }
  #coach.has-preview { padding-top: 12px; }
  #coach.has-preview #instruction { font-size: clamp(40px, 9vw, 64px); margin-top: 4px; }
  #coach.has-preview #detail { font-size: clamp(28px, 6vw, 36px); margin-top: 10px; }
  #coach.has-preview #lights { padding: 16px 0; }
  #coach.has-preview .lamp { width: 84px; height: 84px; }
  #coach.has-preview.take .lamp { width: 96px; height: 96px; }
  .notes { font-size: 16px; color: #4a4843; }
</style>
</head>
<body>

<main id="plan" hidden>
  <h1 id="plan-title">Shot coach</h1>
  <p class="lead" id="plan-detail"></p>
  <div class="plan-grid" id="plan-body">
    <svg id="top" viewBox="-20 0 460 380" width="460" height="380" role="img" aria-label="Top-down plan"></svg>
    <div class="side">
      <svg id="sideview" viewBox="0 0 260 130" width="260" height="130" role="img" aria-label="Side view"></svg>
      <div class="label">Set on the camera</div>
      <p id="camera-card"></p>
      <p class="notes" id="camera-note"></p>
      <div class="label">Lights</div>
      <p id="lights-card"></p>
      <div class="label">Why this side</div>
      <p id="why"></p>
      <p class="notes" id="plan-note"></p>
    </div>
  </div>
</main>

<main id="coach" hidden>
  <img id="thumb" alt="Live view from the camera" hidden>
  <p id="banner" hidden>Recording</p>
  <h1 id="instruction"></h1>
  <p id="detail"></p>
  <div id="lights">
    <div class="light" data-light="face"><div class="lamp"></div><span>Face</span></div>
    <div class="light" data-light="window"><div class="lamp"></div><span>Window</span></div>
    <div class="light" data-light="ratio"><div class="lamp"></div><span>Ratio</span></div>
  </div>
</main>

<main id="report" hidden>
  <p id="report-text"></p>
</main>

<main id="ended" hidden>
  <h1>This session has ended</h1>
  <p>Open the newest link Claude sent.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";

// Same rule as plan.fmt_ft: nearest half foot, and under 2 ft in inches.
function fmtFt(feet) {
  const halves = Math.floor(feet * 2 + 0.5) / 2;
  return halves < 2 ? Math.round(halves * 12) + " in" : halves + " ft";
}

// fill_ratio is in stops; the lighting ratio is 2 to that power: 1 stop is "2:1", 0.5 is "1.4:1".
function fmtRatio(stops) {
  return Math.round(2 ** stops * 10) / 10 + ":1";
}

function svg(parent, tag, attrs, text) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (text !== undefined) el.textContent = text;
  parent.appendChild(el);
  return el;
}

function drawTop(plan, hasWindow) {
  const g = plan.geometry, root = $("top");
  root.replaceChildren();
  svg(root, "text", { x: 210, y: 18, "text-anchor": "middle", "font-size": 13, fill: "#3a3935" }, "Top-down, camera at the bottom");
  if (hasWindow) {
    svg(root, "rect", { x: 90, y: 30, width: 240, height: 14, fill: "#bfe0ff", stroke: "#6aa9e0" });
    svg(root, "text", { x: 210, y: 62, "text-anchor": "middle", "font-size": 12, fill: "#1f5a94" }, "Window (stays in the shot)");
  }
  svg(root, "line", { x1: 210, y1: 340, x2: 210, y2: 150, stroke: "#999", "stroke-dasharray": "4 4" });
  svg(root, "circle", { cx: 210, cy: 140, r: 22, fill: "#e9c9a8", stroke: "#a87c55" });
  svg(root, "text", { x: 210, y: 144, "text-anchor": "middle", "font-size": 12, fill: "#1c1b19" }, "You");
  svg(root, "rect", { x: 192, y: 330, width: 36, height: 24, rx: 4, fill: "#333" });
  svg(root, "text", { x: 210, y: 374, "text-anchor": "middle", "font-size": 12, fill: "#1c1b19" }, "FX30");

  // Frame-left is camera-left, so the left key sits at smaller x.
  const dir = g.side === "left" ? -1 : 1;
  const angle = g.angle_deg * Math.PI / 180;
  const reach = Math.min(g.distance_ft * 30, 150);
  const kx = 210 + dir * Math.sin(angle) * reach, ky = 140 + Math.cos(angle) * reach;
  svg(root, "path", { d: `M210 140 L${kx} ${ky}`, stroke: "#b8690a", "stroke-width": 2, "stroke-dasharray": "3 3" });
  const spin = Math.atan2(210 - kx, ky - 140) * -180 / Math.PI;
  svg(root, "rect", { x: kx - 20, y: ky - 13, width: 40, height: 26, rx: 4, fill: "#e08a1e", transform: `rotate(${spin} ${kx} ${ky})` });
  const lx = dir < 0 ? kx - 26 : kx + 26, anchor = dir < 0 ? "end" : "start";
  svg(root, "text", { x: lx, y: ky - 6, "font-size": 13, "font-weight": 700, "text-anchor": anchor, fill: "#8a4f05" }, "KEY");
  svg(root, "text", { x: lx, y: ky + 9, "font-size": 12, "text-anchor": anchor, fill: "#8a4f05" }, `camera-${g.side}, ${fmtFt(g.distance_ft)}`);
  // The angle sits outside the key's beam on its own side, well above the fill by the lens.
  svg(root, "text", { x: 210 + dir * (Math.tan(angle) * 40 + 8), y: 180, "font-size": 12, "text-anchor": anchor, fill: "#8a4f05" }, `${g.angle_deg} deg off axis`);

  if (!plan.has_fill) return;
  const fx = 210 - dir * 40;
  svg(root, "rect", { x: fx - 15, y: 296, width: 30, height: 10, rx: 3, fill: "#7a8fd6" });
  const fl = dir < 0 ? fx + 22 : fx - 22;
  svg(root, "text", { x: fl, y: 292, "font-size": 13, "font-weight": 700, "text-anchor": dir < 0 ? "start" : "end", fill: "#3d4f9a" }, "FILL");
  svg(root, "text", { x: fl, y: 307, "font-size": 12, "text-anchor": dir < 0 ? "start" : "end", fill: "#3d4f9a" }, `camera-${plan.fill_side}, by lens`);
}

function drawSide(plan) {
  const g = plan.geometry, root = $("sideview");
  root.replaceChildren();
  svg(root, "text", { x: 130, y: 16, "text-anchor": "middle", "font-size": 12, fill: "#3a3935" }, "Side view");
  svg(root, "circle", { cx: 220, cy: 85, r: 14, fill: "#e9c9a8", stroke: "#a87c55" });
  svg(root, "line", { x1: 30, y1: 85, x2: 204, y2: 85, stroke: "#999", "stroke-dasharray": "4 4" });
  svg(root, "text", { x: 34, y: 101, "font-size": 11, fill: "#3a3935" }, "eye line");
  svg(root, "rect", { x: 40, y: 32, width: 30, height: 20, rx: 3, fill: "#e08a1e", transform: `rotate(${g.aim_down_deg} 55 42)` });
  svg(root, "line", { x1: 70, y1: 47, x2: 206, y2: 82, stroke: "#b8690a", "stroke-dasharray": "3 3" });
  svg(root, "text", { x: 76, y: 30, "font-size": 12, fill: "#8a4f05" }, `${fmtFt(g.height_ft)} above eyes, aimed down`);
}

function only(name) {
  for (const id of ["plan", "coach", "report", "ended"]) $(id).hidden = id !== name;
}

function showPlan(s) {
  stopThumb();
  only("plan");
  $("plan-title").textContent = s.instruction;
  $("plan-detail").textContent = s.detail || "";
  const plan = s.plan;
  $("plan-body").hidden = !plan;
  if (!plan) return;
  drawTop(plan, !!(s.lights && s.lights.window));
  drawSide(plan);
  const c = plan.camera;
  $("camera-card").textContent = `ISO ${c.iso} · ${c.shutter} · ${c.aperture} · ${plan.kelvin}K`;
  $("camera-note").textContent = c.note || "";
  const key = plan.key_percent == null ? "Key at the level the coach finds" : `Key about ${plan.key_percent}% at ${plan.kelvin}K`;
  const fill = plan.has_fill ? `Fill ${fmtRatio(plan.fill_ratio)} on camera-${plan.fill_side}` : "No fill light";
  $("lights-card").textContent = `${key} \u00b7 ${fill}`;
  $("why").textContent = plan.why;
  $("plan-note").textContent = plan.note || "";
}

// Live preview: one frame at a time. The next request waits for the last to load or fail.
let previewOn = false, previewTimer = null, previewGen = 0, inflight = null;
function setPreview(visible) {
  $("thumb").hidden = !visible;
  $("coach").classList.toggle("has-preview", visible);
}
function nextFrame(gen) {
  if (gen !== previewGen) return;
  const img = new Image();
  inflight = img;
  const again = (ok) => {
    if (gen !== previewGen) return;
    if (ok) { $("thumb").src = img.src; setPreview(true); } else setPreview(false);
    previewTimer = setTimeout(() => nextFrame(gen), 1000);
  };
  img.onload = () => again(true);
  img.onerror = () => again(false);
  img.src = "/frame.jpg?t=" + Date.now();
}
// previewGen changes on every start and stop, so a stale chain can never schedule another frame.
function startThumb() {
  if (previewOn) return;
  previewOn = true;
  const gen = ++previewGen;
  if (document.visibilityState === "visible") nextFrame(gen);
}
function stopThumb() {
  previewOn = false; previewGen += 1;
  clearTimeout(previewTimer); previewTimer = null;
  if (inflight) { inflight.onload = null; inflight.onerror = null; inflight = null; }
}

function showCoach(s) {
  only("coach");
  const take = s.screen === "take";
  $("coach").classList.toggle("take", take);
  $("banner").hidden = !take;
  // On the take screen the instruction slot says "Recording" (the banner does); only a held reason shows.
  $("instruction").hidden = take;
  $("instruction").textContent = s.instruction;
  $("detail").textContent = s.detail || "";
  $("detail").hidden = !s.detail;
  for (const el of document.querySelectorAll(".light")) {
    const colour = s.lights ? s.lights[el.dataset.light] : null;
    el.hidden = !colour;
    el.querySelector(".lamp").className = "lamp " + (colour || "");
    el.setAttribute("aria-label", colour ? `${el.dataset.light}: ${colour}` : "");
  }
  startThumb();
}

function showReport(s) {
  stopThumb();
  only("report");
  $("report-text").textContent = (s.report && s.report.text) || s.instruction;
}

function show(s) {
  if (ended) return;
  if (s.screen === "plan") showPlan(s);
  else if (s.screen === "report") showReport(s);
  else showCoach(s);
}

// A stale page: the stream keeps failing while the phone is in use, or the server says the link is no longer good.
// A locked phone or a wifi drop while the page is hidden is not an ending.
let ended = false, failures = 0, events = null;
function end() {
  ended = true; stopThumb(); if (events) events.close(); only("ended");
}
function connect() {
  if (events) events.close();
  events = new EventSource("/events");
  events.onopen = () => { failures = 0; };
  events.onmessage = (e) => { failures = 0; show(JSON.parse(e.data)); };
  events.onerror = () => {
    if (document.visibilityState !== "visible") return;
    failures += 1;
    if (failures >= 3) { end(); return; }
    probe(events.readyState === 2);
  };
}
// A 403 means the link is dead; anything else is a blip (and reopens the stream if it was closed).
function probe(reopen) {
  fetch("/frame.jpg", { cache: "no-store" }).then((r) => {
    if (r.status === 403) end(); else if (reopen && !ended && (!events || events.readyState === 2)) connect();
  }).catch(() => { if (reopen && !ended) connect(); });
}
document.addEventListener("visibilitychange", () => {
  if (ended) return;
  if (document.visibilityState !== "visible") {
    clearTimeout(previewTimer); previewTimer = null; previewGen += 1; // pause the frame loop while hidden
    return;
  }
  failures = 0;
  if (previewOn) nextFrame(++previewGen);
  if (!events || events.readyState === 2) probe(true);
});
connect();
</script>
</body>
</html>
